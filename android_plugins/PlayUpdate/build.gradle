// Godot Android plugin (v2) for Google Play in-app updates and the in-app rating card. CI builds it with
// `gradle assembleRelease assembleDebug` and copies the .aar files to addons/PlayUpdate/bin/.
plugins {
    id 'com.android.library' version '8.7.3'
}

android {
    namespace 'org.bonechain.playupdate'
    compileSdk 35
    defaultConfig {
        minSdk 24
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // These come with the game itself: Godot's library, and Google's app-update and review libraries,
    // which addons/PlayUpdate/export_plugin.gd adds to the Android build.
    compileOnly 'org.godotengine:godot:4.7.2.stable'
    compileOnly 'com.google.android.play:app-update:2.1.0'
    compileOnly 'com.google.android.play:review:2.0.2'
}
